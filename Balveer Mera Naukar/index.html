<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balveer - Virtual Assistant</title>
    <link rel="shortcut icon" href="avatar.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.4.1/html2canvas.min.js"></script>
  </head>

  <body>
    <section class="main">
      <div class="image-container">
        <div class="image">
          <img src="./listening.gif" alt="image" />
        </div>
        <h1>B A L V E E R </h1>
        <p>
          I'm a Virtual Assistant by Abhishek Chaudhary. What help you want ?
        </p>
      </div>
      <div class="input">
        <button class="talk"><i class="fas fa-microphone-alt"></i></button>
        <h1 class="content">Click here to speak</h1>
      </div>
      <style>
        /* Add this to your existing CSS */
        .quotes {
          color: white; /* White text */
          background-color: black; /* Black background */
          padding: 10px;
          font-size: 1.2em;
          margin-top: 20px;
        }
        .news {
          color: white; /* White text */

          background-color: black; /* Black background */

          padding: 10px;
          font-size: 1.2em;
          margin-top: 20px;
        }
        .recipes {
          color: white; /* White text */

          background-color: black; /* Black background */

          padding: 10px;
          font-size: 1.2em;
          margin-top: 10px;
        }
        .jokes {
          color: white; /* White text */

          background-color: black; /* Black background */

          padding: 10px;
          font-size: 1.2em;
          margin-top: 10px;
        }
      </style>
      <!-- Add  this to your existing HTML where you want the quotes to appear -->
      <div class="quotes"></div>
      <br />
      <div class="news"></div><br />
      <div class="recipes"></div><br />
      <div class="jokes"></div>
    </section>
    <script src="app.js"></script>
  </body>
</html>
