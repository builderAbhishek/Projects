<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>DCA आईडी कार्ड जनरेटर</title>
</head>
<body>
    <div class="id-card">
        <h2>DCA I'd Card Generator</h2>
        <div class="field">
            <label for="name">छात्र का नाम:</label>
            <input type="text" id="name" placeholder="यहां नाम डालें">
        </div>
        <div class="field">
            <label for="roll-number">छात्र का रोल नंबर:</label>
            <input type="text" id="roll-number" placeholder="यहां रोल नंबर डालें">
        </div>
        <div class="field">
            <label for="mobile">छात्र का मोबाइल नंबर:</label>
            <input type="text" id="mobile" placeholder="यहां मोबाइल नंबर डालें">
        </div>
        <div class="field">
            <label for="address">छात्र का पता:</label>
            <input type="text" id="address" placeholder="यहां पता डालें">
        </div>
        <div class="field">
            <label for="father-name">छात्र के पिता का नाम:</label>
            <input type="text" id="father-name" placeholder="यहां पिता का नाम डालें">
        </div>
        <div class="field">
            <label for="student-image">छात्र की छवि:</label>
            <input type="file" id="student-image" accept="image/*">
        </div>
        <button onclick="generateCard()">छात्र की आईडी कार्ड जनरेट करें</button>
        <button onclick="document(location='back.html')">Back Id Card</button>
    </div>
    
    <canvas id="idCanvas" style="display:none;"></canvas>
    <button id="downloadBtn" style="display:none;">डाउनलोड करें</button>

    <script src="script.js"></script>
</body>
</html>
